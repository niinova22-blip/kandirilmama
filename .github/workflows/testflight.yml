name: TestFlight

# Yalnızca elle tetiklenir (Actions › TestFlight › Run workflow).
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      PROFILE_NAME: Kandirilmama AppStore CI
    steps:
      - uses: actions/checkout@v4

      - name: Ayarları denetle
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          APPSTORE_PROFILE: ${{ secrets.APPSTORE_PROFILE }}
        run: |
          for name in APPLE_TEAM_ID BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID DIST_CERT_P12 APPSTORE_PROFILE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name tanımlı değil (README › TestFlight bölümüne bakın)"
              exit 1
            fi
          done
          bash scripts/check-no-network.sh

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode projesini üret
        run: |
          brew install xcodegen
          xcodegen generate

      # Bulut imzalama kullanılmıyor: sertifika adında ASCII dışı karakter (Ö) olduğunda
      # codesign'ın ürettiği designated requirement sertifikayla eşleşmiyor (ITMS 90035).
      - name: İmzalama sertifikası ve profili kur
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          APPSTORE_PROFILE: ${{ secrets.APPSTORE_PROFILE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::İmzalama kimliği bulunamadı"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            printf '%s' "$APPSTORE_PROFILE" | base64 --decode > "$dir/kandirilmama-appstore.mobileprovision"
          done

      - name: Arşivle
        run: |
          xcodebuild archive \
            -project Kandirilmama.xcodeproj \
            -scheme Kandirilmama \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kandirilmama.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: IPA üret ve imzayı doğrula
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGN_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kandirilmama.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

          cd "$RUNNER_TEMP/export"
          rm -rf ipa && mkdir ipa && unzip -q Kandirilmama.ipa -d ipa
          APP=ipa/Payload/Kandirilmama.app

          if ! codesign --verify --deep --strict "$APP" 2>/dev/null; then
            echo "Designated requirement sertifikayla eşleşmiyor; Team ID tabanlı kuralla yeniden imzalanıyor."
            codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null
            codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN" \
              --entitlements "$RUNNER_TEMP/entitlements.plist" \
              --requirements "=designated => anchor apple generic and identifier \"$BUNDLE_ID\" and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\" and certificate 1[field.1.2.840.113635.100.6.2.1] /* exists */" \
              "$APP"
            rm Kandirilmama.ipa
            (cd ipa && zip -qry ../Kandirilmama.ipa .)
          fi

          codesign -dvv "$APP" 2>&1 | grep -E "^Authority=|^Identifier="
          codesign -d -r- "$APP" 2>&1 | grep designated
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p -
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: TestFlight'a yükle
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/Kandirilmama.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Gizli dosyaları temizle
        if: always()
        run: |
          rm -rf ~/.appstoreconnect/private_keys
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/kandirilmama-appstore.mobileprovision" \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/kandirilmama-appstore.mobileprovision"
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
