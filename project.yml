name: Kandirilmama
options:
  bundleIdPrefix: com.kandirilmama
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# Bilinçli olarak "packages:" bölümü YOK. Harici bağımlılık eklemek yasak
# (scripts/check-no-network.sh bunu CI'da denetler).

targets:
  Kandirilmama:
    type: application
    platform: iOS
    sources:
      - Kandirilmama
    info:
      path: Kandirilmama/Info.plist
      properties:
        CFBundleDisplayName: Kandırılmama
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Görüşmeyi yalnızca bu cihazda metne çevirmek için mikrofon kullanılır. Ses kaydı hiçbir yere gönderilmez.
        NSSpeechRecognitionUsageDescription: Konuşma, Apple'ın cihaz üzerindeki tanıma motoruyla metne çevrilir. Hiçbir veri cihazdan çıkmaz.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kandirilmama.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # FoundationModels yalnızca iOS 26+ cihazlarda var. Weak link sayesinde
        # iOS 17/18 cihazlarda (ör. iPhone 11) uygulama açılışta çökmez.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]

  KandirilmamaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KandirilmamaTests
    dependencies:
      - target: Kandirilmama

schemes:
  Kandirilmama:
    build:
      targets:
        Kandirilmama: all
        KandirilmamaTests: [test]
    test:
      targets:
        - KandirilmamaTests
